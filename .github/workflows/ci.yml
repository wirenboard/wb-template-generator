name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    container:
      image: python:3.12-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: apt-get update && apt-get install -y poppler-utils curl && rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Ruff check
        run: ruff check . --config pyproject.toml

      - name: Mypy
        run: mypy --config-file pyproject.toml models.py template_builder.py jinja_exporter.py

      - name: Tests with coverage
        run: pytest tests/ -v --cov=. --cov-report=term --cov-fail-under=70

  frontend:
    name: Frontend — lint, typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: TypeScript check
        run: npx tsc -b

      - name: Tests
        run: npm test

  changelog:
    name: CHANGELOG — проверка версии
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить обновление CHANGELOG.md
        run: |
          if git diff origin/main...HEAD --name-only | grep -q '^CHANGELOG.md$'; then
            echo "✅ CHANGELOG.md обновлён"
          else
            echo "::error::CHANGELOG.md не обновлён в этом PR. Добавьте запись об изменениях."
            exit 1
          fi

      - name: Проверить что есть версионная секция с записями
        run: |
          # Первая версионная секция (## [X.Y.Z]) должна существовать
          VERSION=$(grep -oP '## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::В CHANGELOG.md нет ни одной версионной секции. Добавьте ## [X.Y.Z] - YYYY-MM-DD с записями."
            exit 1
          fi
          # Проверяем что первая секция — версия, а не Unreleased
          FIRST_SECTION=$(grep -oP '## \[\K[^\]]+' CHANGELOG.md | head -1)
          if [ "$FIRST_SECTION" = "Unreleased" ]; then
            echo "::error::Первая секция в CHANGELOG.md — [Unreleased]. Добавьте версионную секцию ## [X.Y.Z] - $(date +%Y-%m-%d) с записями перед мержем."
            exit 1
          fi
          echo "✅ Версия: $VERSION"

  tag:
    name: Создать git-тег из версии в CHANGELOG
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Извлечь версию и создать тег
        run: |
          VERSION=$(grep -oP '## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1)
          TAG="v${VERSION}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Тег ${TAG} уже существует — пропускаем"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
            echo "✅ Создан тег ${TAG}"
          fi
