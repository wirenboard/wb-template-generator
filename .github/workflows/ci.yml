# Проверки кода — в Jenkins (Jenkinsfile). Здесь только выпуск git-тега.
name: CI

on:
  push:
    branches: [main]

jobs:
  tag:
    name: Создать git-тег из версии в CHANGELOG
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Извлечь версию и создать тег
        run: |
          VERSION=$(grep -oP '## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1)
          TAG="v${VERSION}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Тег ${TAG} уже существует — пропускаем"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
            echo "✅ Создан тег ${TAG}"
          fi
