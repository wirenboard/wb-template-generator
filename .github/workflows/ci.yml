name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    container:
      image: python:3.12-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: apt-get update && apt-get install -y poppler-utils curl && rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Ruff check
        run: ruff check . --config pyproject.toml

      - name: Mypy
        run: mypy --config-file pyproject.toml models.py template_builder.py jinja_exporter.py

      - name: Tests with coverage
        run: pytest tests/ -v --cov=. --cov-report=term --cov-fail-under=70

  frontend:
    name: Frontend — lint, typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: TypeScript check
        run: npx tsc -b
