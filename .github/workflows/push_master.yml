name: push_master
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io/wirenboard

jobs:
  checks:
    name: lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r backend/requirements.txt && cd frontend && npm ci
      - run: make lint
      - run: make test

  release:
    name: build → deploy → smoke
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # TODO(CLOUD-622): добавить `environment: production` (без required reviewers).
    # лок только на выкат: иначе новый push вытесняет из очереди нажатый откат
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужно сторожу и доставке compose из git

      - run: make guard-staleness

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/wb-template-generator-backend:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/wb-template-generator-frontend:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # успех проставится только после smoke
      - uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8  # v1.5.0
        id: dep
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          ref: ${{ github.sha }}

      - uses: ./.github/actions/deploy
        with:
          tag: ${{ github.sha }}
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          dir: ${{ vars.DEPLOY_DIR }}
          registry: ${{ env.REGISTRY }}

      - name: smoke
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: make smoke URL=${{ vars.PROD_URL }}

      - uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8  # v1.5.0
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.dep.outputs.env }}
          deployment_id: ${{ steps.dep.outputs.deployment_id }}

      # авто-откат: цель — предыдущий success из журнала
      - uses: actions/github-script@v7
        id: prev
        if: failure()
        with:
          script: |
            const deps = await github.rest.repos.listDeployments({
              owner: context.repo.owner, repo: context.repo.repo,
              environment: 'production', per_page: 30 });
            for (const d of deps.data) {
              if (d.sha === context.sha) continue;
              const st = await github.rest.repos.listDeploymentStatuses({
                owner: context.repo.owner, repo: context.repo.repo, deployment_id: d.id, per_page: 1 });
              if (st.data[0]?.state === 'success') { core.setOutput('sha', d.sha); return; }
            }
            core.warning('в журнале нет предыдущего успешного выката — откатывай кнопкой (rollback.yml)');

      - uses: ./.github/actions/deploy
        if: failure() && steps.prev.outputs.sha != ''
        with:
          tag: ${{ steps.prev.outputs.sha }}
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          dir: ${{ vars.DEPLOY_DIR }}
          registry: ${{ env.REGISTRY }}

      # откат тоже событие выката — иначе журнал разойдётся с реальностью
      - uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8  # v1.5.0
        if: failure() && steps.prev.outputs.sha != ''
        with:
          step: deploy_status
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          status: success
          deployment_id: ${{ steps.dep.outputs.deployment_id }}
          desc: auto-rollback на ${{ steps.prev.outputs.sha }}

      # break-glass-зеркало: current + prev, только после успешного smoke
      - uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f  # v1.2.2
        if: success()
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          envs: DEPLOY_DIR,SHA
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            [ -f last-good-sha ] && cp last-good-sha last-good-sha.prev || true
            echo "$SHA" > last-good-sha

  tag:
    name: git-тег из CHANGELOG
    # не needs: release — транзиентный smoke не должен оставить версию без тега
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          VERSION=$(grep -oP '## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1)
          [ -n "$VERSION" ] || { echo "::error::в CHANGELOG.md нет секции ## [X.Y.Z]"; exit 1; }
          TAG="v${VERSION}"
          git ls-remote --tags origin | grep -q "refs/tags/${TAG}$" && { echo "тег ${TAG} есть"; exit 0; }
          git tag "${TAG}" && git push origin "${TAG}"
