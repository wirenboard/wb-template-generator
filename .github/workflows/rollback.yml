# Откат одной кнопкой: безусловный, без гейта.
# На среде production НЕ включать required reviewers — иначе загейтит и откат.
name: rollback
on:
  workflow_dispatch:
    inputs:
      target:
        description: "git-SHA для отката (пусто = предыдущий успешный из журнала)"
        required: false
        default: ""
      confirm_migrations:
        description: "В диапазоне отката есть миграции; совместимость N−1 проверена — откатывать"
        type: boolean
        default: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # TODO(CLOUD-622): вернуть `environment: production` вместе с push_master.yml.
    # Тогда же проверить, что на среде НЕ включены required reviewers: защита среды
    # действует на все job'ы и загейтила бы откат, который обязан быть безусловным.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions: { deployments: write, contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # проверки сравнивают цель с origin/main, а не с HEAD прогона: dispatch можно
      # запустить с любой ветки
      - run: git fetch --no-tags origin main

      # Якорь — журнал: последний success = то, что в проде; цель = предыдущий success
      # с другим SHA. Вход идёт через env, не интерполяцией (script injection).
      - uses: actions/github-script@v7
        id: target
        env:
          TARGET_INPUT: ${{ inputs.target }}
        with:
          script: |
            let sha = (process.env.TARGET_INPUT || '').trim().toLowerCase();
            if (sha && !/^[0-9a-f]{40}$/.test(sha))
              return core.setFailed(`target «${sha}» — не полный 40-символьный git-SHA`);
            if (!sha) {
              const deps = await github.rest.repos.listDeployments({
                owner: context.repo.owner, repo: context.repo.repo,
                environment: 'production', per_page: 30 });
              const ok = [];
              for (const d of deps.data) {
                const st = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner, repo: context.repo.repo, deployment_id: d.id, per_page: 1 });
                if (st.data[0]?.state === 'success') ok.push(d.sha);
              }
              sha = ok.find(s => s !== ok[0]) || '';
              if (!sha) return core.setFailed('В журнале нет предыдущего успешного деплоя — укажи target явно.');
              core.info(`прод сейчас: ${ok[0]} → откат на: ${sha}`);
            }
            core.setOutput('sha', sha);

      - name: цель есть в истории и является предком main
        env:
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          git cat-file -e "${TARGET}^{commit}" || { echo "::error::коммит ${TARGET} не найден"; exit 1; }
          git merge-base --is-ancestor "${TARGET}" origin/main \
            || { echo "::error::${TARGET} не предок origin/main"; exit 1; }

      - name: образ есть в реестре
        env:
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker manifest inspect "ghcr.io/wirenboard/wb-template-generator-backend:${TARGET}"  >/dev/null
          docker manifest inspect "ghcr.io/wirenboard/wb-template-generator-frontend:${TARGET}" >/dev/null

      # предохранитель N−1: миграции в диапазоне отката → стоп до подтверждения
      - name: миграции в диапазоне отката
        env:
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          MIGR=$(git diff --name-only "${TARGET}"..origin/main -- '**/migrations/**' | head -5)
          if [ -n "$MIGR" ] && [ "${{ inputs.confirm_migrations }}" != "true" ]; then
            echo "::error::Диапазон отката содержит миграции БД: $MIGR"
            echo "::error::Проверь совместимость N−1 и перезапусти с галкой confirm_migrations."
            exit 1
          fi

      - uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8  # v1.5.0
        id: dep
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          ref: ${{ steps.target.outputs.sha }}
          desc: rollback

      - uses: ./.github/actions/deploy
        with:
          tag: ${{ steps.target.outputs.sha }}
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          dir: ${{ vars.DEPLOY_DIR }}

      - name: smoke
        env:
          EXPECT_SHA: ${{ steps.target.outputs.sha }}
        run: make smoke URL=${{ vars.PROD_URL }}

      - uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8  # v1.5.0
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.dep.outputs.env }}
          deployment_id: ${{ steps.dep.outputs.deployment_id }}
