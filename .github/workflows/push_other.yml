name: push_other
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r backend/requirements.txt && cd frontend && npm ci
      - run: make lint
      - run: make test

  changelog:
    name: CHANGELOG
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: dangoslen/changelog-enforcer@204e7d3ef26579f4cd0fd759c57032656fdf23c7  # v3.6.1
        with:
          changeLogPath: CHANGELOG.md
          skipLabels: "skip changelog"

      # версия и git-тег берутся из первой секции ## [X.Y.Z]; записи, забытые
      # в [Unreleased], оставили бы релиз под старым номером
      - name: секция [Unreleased] пуста
        run: |
          UNRELEASED=$(sed -n '/^## \[Unreleased\]/,/^## \[/{ /^## \[/d; /^[[:space:]]*$/d; p; }' CHANGELOG.md)
          if [ -n "$UNRELEASED" ]; then
            echo "::error::[Unreleased] содержит записи — перенеси их в ## [X.Y.Z] перед мержем"
            echo "$UNRELEASED"
            exit 1
          fi
