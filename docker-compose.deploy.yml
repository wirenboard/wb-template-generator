# Боевой сервер: готовый образ из реестра по git-SHA (DEPLOY_TAG), без сборки на месте.
# Обычно запускается из CI; руками — см. DEPLOYING.md.
# Локальная разработка — docker-compose.yml.
services:
  backend:
    image: ${REGISTRY:-ghcr.io/wirenboard}/wb-template-generator-backend:${DEPLOY_TAG:?set DEPLOY_TAG=<git-sha>}
    env_file: .env
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app

  frontend:
    image: ${REGISTRY:-ghcr.io/wirenboard}/wb-template-generator-frontend:${DEPLOY_TAG:?set DEPLOY_TAG=<git-sha>}
    # Привязка к 127.0.0.1 обязательна: TLS и внешний вход дают nginx на хосте
    # (роль wb_http_proxy в infra проксирует домен на 127.0.0.1:8080). Без адреса
    # docker публикует порт на всех интерфейсах и открывает приложение наружу
    # в обход TLS — заодно мимо firewall, потому что правила ставит docker сам.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app

networks:
  app:
    driver: bridge
