# Боевой сервер: готовый образ из реестра по git-SHA (DEPLOY_TAG), без сборки на месте.
# Обычно запускается из CI; руками — см. DEPLOYING.md.
# Локальная разработка — docker-compose.yml.
services:
  backend:
    image: ${REGISTRY:-ghcr.io/wirenboard}/wb-template-generator-backend:${DEPLOY_TAG:?set DEPLOY_TAG=<git-sha>}
    env_file: .env
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app

  frontend:
    image: ${REGISTRY:-ghcr.io/wirenboard}/wb-template-generator-frontend:${DEPLOY_TAG:?set DEPLOY_TAG=<git-sha>}
    # Адрес привязки задаётся ЦЕЛИКОМ одной переменной и по умолчанию равен тому,
    # что уже работает на сервере. Привязка к 127.0.0.1 обязательна: TLS и внешний
    # вход дают nginx на хосте (роль wb_http_proxy проксирует домен на 127.0.0.1:8080).
    # Без адреса docker публикует порт на всех интерфейсах — приложение оказалось бы
    # в интернете мимо TLS и мимо firewall, потому что правила ставит docker сам.
    #
    # Имя WEB_PUBLISH, а не WEB_PORT: в существующем .env на сервере лежит
    # WEB_PORT=127.0.0.1:8080 (так добивались нужной привязки в старом файле).
    # Подстановка его в шаблон вида ${WEB_BIND}:${WEB_PORT} дала бы
    # «127.0.0.1:127.0.0.1:8080:80» и падение выката.
    ports:
      - "${WEB_PUBLISH:-127.0.0.1:8080}:80"
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app

networks:
  app:
    driver: bridge
