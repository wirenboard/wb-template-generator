server {
    listen 80;

    # PRJ-1089 pilot: лёгкий health-эндпоинт для HEALTHCHECK/verify (rolling-update).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # nginx резолвит имя upstream'а ОДИН раз при старте и кэширует IP навсегда.
        # При rolling-update backend получает новый IP, а nginx продолжает стучать в старый
        # → 502 на /api до перезапуска фронта. Явный резолвер Docker DNS + имя через
        # переменную заставляют nginx перечитывать адрес (valid=5s).
        # $request_uri обязателен: с переменной в proxy_pass nginx не подставляет
        # исходный URI автоматически.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream_api backend:9000;
        proxy_pass http://$upstream_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2m;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
