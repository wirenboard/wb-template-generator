# Ожидания для prompt regression тестов.
# Проверяем только структурные поля — name/description/translations вариативны.
#
# Поля:
#   address     — int или строка "reg:bit:width"
#   reg_type    — "holding", "input", "coil", "discrete"
#   channel_type — ожидаемый тип канала (опционально)
#   has_enum    — есть ли enum/enum_entries (опционально)
#   format      — формат регистра (опционально)

# 01 — FC table: Function Code определяет тип, адреса как есть (не вычитать 1)
01_fc_table_coil_discrete:
  registers:
    - address: 1
      reg_type: coil
      channel_type: switch
      has_enum: false
    - address: 3
      reg_type: discrete
      channel_type: switch
      has_enum: false
    - address: 5
      reg_type: coil
      channel_type: switch
      has_enum: false

# 02 — Legacy 5-digit: 40001→holding addr 0, 30001→input addr 0
02_legacy_5digit:
  registers:
    - address: 0
      reg_type: holding
      format: float
    - address: 2
      reg_type: holding
      format: float
    - address: 0
      reg_type: input

# 03 — Plain addresses: адреса как есть, без вычитания
03_plain_addresses:
  registers:
    - address: 0
      reg_type: holding
    - address: 1
      reg_type: holding
    - address: 100
      reg_type: holding

# 04 — Bitwise holding: биты → адреса "reg:bit:width"
04_bitwise_holding:
  registers:
    - address: "200:0:1"
      reg_type: holding
    - address: "200:1:1"
      reg_type: holding
    - address: "200:2:1"
      reg_type: holding

# 05 — Coil/discrete → switch, БЕЗ enum (даже если описаны состояния 0/1)
05_coil_switch_no_enum:
  registers:
    - address: 0
      reg_type: coil
      channel_type: switch
      has_enum: false
    - address: 0
      reg_type: discrete
      channel_type: switch
      has_enum: false
