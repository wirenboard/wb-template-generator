[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["models", "template_builder"]
strict = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["jinja_exporter"]
disallow_untyped_defs = true
warn_return_any = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["openai.*", "pdf2image.*", "openpyxl.*", "PIL.*", "httpx.*", "pdfplumber.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
