services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    network_mode: host
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9000"]
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    network_mode: host
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
