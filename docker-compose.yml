# Локальная разработка. Прод-файл выката — в wirenboard/infra, роль wb_template_generator.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    network_mode: host
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9000", "--no-access-log"]
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    network_mode: host
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    # dev-конфиг nginx слушает 9080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
