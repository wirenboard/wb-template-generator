# Локальная разработка: собирает образы из исходников, host networking (9080/9000).
# Прод-файл выката живёт в wirenboard/infra, роль wb_template_generator.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    network_mode: host
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9000"]
    env_file: .env
    restart: unless-stopped

  frontend:
    build: ./frontend
    network_mode: host
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    # в образе HEALTHCHECK бьёт в :80, а dev-конфиг слушает 9080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
