services:
  backend:
    build: ./backend
    network_mode: host
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      - LLM_API_URL=${LLM_API_URL:-}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-0}
      - LLM_LEGACY_MAX_TOKENS=${LLM_LEGACY_MAX_TOKENS:-false}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-600}
      - LLM_SOFT_TIMEOUT=${LLM_SOFT_TIMEOUT:-180}
      - PDF_BATCH_SIZE=${PDF_BATCH_SIZE:-0}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-1}
      - QUEUE_SERVER_MAX_CONCURRENT=${QUEUE_SERVER_MAX_CONCURRENT:-15}
      - QUEUE_CUSTOM_MAX_CONCURRENT=${QUEUE_CUSTOM_MAX_CONCURRENT:-15}
      - QUEUE_ACTIVATION_DELAY=${QUEUE_ACTIVATION_DELAY:-1.0}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-10}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    network_mode: host
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
